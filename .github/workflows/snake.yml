# Genera las imágenes del perfil (serpiente de contribuciones y gráfico de los DARWINs)
# y las publica en la rama "output".
# Se ejecuta una vez al día, en cada push a main y a mano desde la pestaña Actions.
name: Generate profile images

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Cotizaciones de EGXL y EZDK; si Darwinex falla, no se publica y queda el gráfico anterior
      - name: Gráfico de los DARWINs
        run: python3 scripts/darwin_chart.py dist

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
